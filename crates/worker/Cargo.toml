[package]
name = "meet-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
meeting-core = { path = "../meeting-core" }
sfu-api = { path = "../sfu-api" }
worker = "0.8.7"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
# `#[durable_object]` expands to code that names the `wasm_bindgen` crate directly.
wasm-bindgen = "0.2.129"
# The `wasm_js` backend reads `crypto.getRandomValues`, which Workers provide.
getrandom = { version = "0.4.3", features = ["wasm_js"] }
# The owner's session cookie: HMAC-SHA256 in pure Rust, so it needs no SubtleCrypto.
hmac = "0.13.0"
sha2 = "0.11.0"
futures-util = { version = "0.3", default-features = false }
# The recorder: Opus encoding in pure Rust (spike 3 in docs/spikes), the Ogg container, and
# base64 for Workers AI's `audio` input.
opus-rs = "0.1.37"
ogg = "0.9.2"
base64 = "0.22.1"
