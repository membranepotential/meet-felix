# The deployment's own values are placeholders (`${…}`), filled from the git-ignored `.env`
# (see `.env.example`): `pnpm run wrangler:config` writes the result to the git-ignored
# `wrangler.local.toml`, which `pnpm dev` and `pnpm run release` use. The e2e stacks read this
# file directly and set the values with `--var`.
name = "meet-felix"
main = "build/index.js"
# Newest date the pinned workerd (1.20261001.1) supports. `RoomObject::alarm` relies on
# dates >= 2026-02-24, where deleteAll() also deletes the alarm.
compatibility_date = "2026-10-01"

[build]
cwd = "crates/worker"
# worker-build resolves --out-dir against the crate, so the bundle lands in /build at the repo root.
command = "worker-build --release --out-dir ../../build"
watch_dir = "crates/worker/src"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

[[durable_objects.bindings]]
name = "RECORDERS"
class_name = "RecorderObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]

# One RecorderObject per recorded meeting (D16 in docs/recording).
[[migrations]]
tag = "v2"
new_sqlite_classes = ["RecorderObject"]

[vars]
# Pins each new Room DO to the EU. Local workerd implements no jurisdictions, so run
# `wrangler dev --var ROOM_JURISDICTION:` to create rooms without one. Any value other than
# "", "eu", "us" or "fedramp" makes every request fail with 500.
ROOM_JURISDICTION = "eu"
# Where the SFU's WebSocket adapters deliver recorded audio (`/rec/...`). The workers.dev host,
# not a custom domain: the media stream skips the Pages front door and its double billing
# (research 11). For a local test, `--var RECORDER_ORIGIN:http://localhost:<port>`.
RECORDER_ORIGIN = "${RECORDER_ORIGIN}"
# The owner's display name, prefilled when the owner joins a meeting (D32).
OWNER_NAME = "${OWNER_NAME}"
# Optional SFU_API_URL replaces https://rtc.live.cloudflare.com/v1, for the e2e mock SFU
# (web/e2e/mock-sfu.ts) only.

# Secrets (`pnpm exec wrangler secret put NAME`; locally in the git-ignored `.dev.vars`):
# - CREATE_SECRET: the owner password. `POST /api/login` checks it and issues the session cookie;
#   owner routes also accept it as a bearer token. At least 20 characters, machine-generated
#   (`openssl rand -base64 32`); a shorter one locks the owner out.
# - SESSION_KEY: signs the owner's session cookies; rotating it ends every session. At least 32
#   characters, random (`openssl rand -base64 32`); without it the owner is locked out.
# - CALLS_APP_ID, CALLS_APP_SECRET: the Realtime SFU app. Without them every join fails with
#   `SfuUnavailable`.
# - TURN_KEY_ID, TURN_KEY_API_TOKEN: a Realtime TURN key. With them, `GET /api/ice` adds TURN
#   servers with 6-hour credentials; without them it serves STUN only.

# Per-client rate limits (D6 in docs/links; crates/worker/src/limits.rs), counted per Cloudflare
# location over 60-second windows. `namespace_id` is any positive integer unique in the account.
# `wrangler dev` simulates them locally. The e2e stacks raise the limits, except the spec that
# tests them.
# - PUBLIC_LIMIT: /api/meeting/:words, /api/ice, /ws/:words and /api/transcript/:token...
#   together, per client IP. A join costs about three, the transcript page one every 10 s; an
#   office behind one address still fits. Requests without a usable CF-Connecting-IP are not
#   limited (logged once per isolate).
# - OWNER_AUTH_LIMIT: password comparisons (login and bearer token) per client IP.
[[ratelimits]]
name = "PUBLIC_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "OWNER_AUTH_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# `wrangler dev` uses a local store, so the placeholder id works there.
[[kv_namespaces]]
binding = "MEETINGS"
id = "${MEETINGS_KV_ID}"

# Recorded audio chunks (audio/<recorder>/...) and transcripts (transcripts/<recorder>/...).
# The bucket lives in the EU jurisdiction, which the binding must name. An R2 lifecycle rule
# deletes audio/ objects after 3 days as the backstop for D18 (set with wrangler, see
# docs/recording). `wrangler dev` simulates the bucket locally.
[[r2_buckets]]
binding = "RECORDINGS"
bucket_name = "meet-felix-recordings"
jurisdiction = "eu"

# Workers AI for the transcript job (Whisper). In `wrangler dev` it runs remotely and is billed.
[ai]
binding = "AI"

# The built SvelteKit app (web/build) is served as static assets; unknown paths fall back to
# index.html for the SPA router. /api/*, /ws/* and the recorder's /rec/* always reach the
# Worker first. web/static/_headers sends `nosniff` and `frame-ancestors 'none'` with every
# static file (the SPA fallback included) and keeps /t/* (transcript links) out of referrers and
# indexes. The script policy is a <meta> tag in each page (`csp` in web/vite.config.ts), which
# cannot carry frame-ancestors. Rules matching one path join a repeated header with commas
# (https://developers.cloudflare.com/workers/static-assets/headers/), so no header is in two.
[assets]
directory = "web/build"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws/*", "/rec/*"]

# Workers Logs: every invocation, console output and exception of the Worker and its Durable
# Objects, kept 7 days (Paid) or 3 days (Free) under Workers & Pages → meet-felix → Observability.
[observability]
enabled = true
head_sampling_rate = 1
